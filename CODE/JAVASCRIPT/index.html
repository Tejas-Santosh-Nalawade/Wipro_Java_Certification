<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb ON OFF</title>
</head>
<body>
    <h1>What can Javascript do</h1>
    <p>Javascript can change the HTML at runtime</p>
    <p>In this case javascript can change the state of a bulb</p>
    <button id="off" onclick="turnOff()">Turn Off</button>
    <img id="bulb" src="pic_bulboff.gif" alt="Bulb Off">
    <button id="on" onclick="turnOn()">Turn On</button>

</body>
</html>
